# This is a Declarative Automation Bundle definition for verticeaovivo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: verticeaovivo
  uuid: 8d796bb9-0de4-4dac-96cb-0a7d383b6f47

sync:
  exclude:
    - "minha-torre/**"

include:
  - resources/*.yml

# Variáveis do projeto Farol. As chaves do data lake NÃO têm valor aqui:
# o valor fica em .databricks/bundle/dev/variable-overrides.json (fora do Git).
variables:
  catalog:
    description: Catálogo do projeto Farol
    default: lakehouse_vertice
  warehouse_id:
    description: SQL warehouse das sql_task (Serverless Starter Warehouse)
    default: de6ef3f2722321c7
  s3_access_key_id:
    description: chave do data lake
  s3_secret_access_key:
    description: chave secreta do data lake

targets:
  dev:
    # Sem 'mode: development': ele prefixaria os nomes com '[dev usuario]'.
    # Os agendamentos e gatilhos ficam pausados pelo preset abaixo.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    default: true
    presets:
      trigger_pause_status: PAUSED
    workspace:
      host: https://dbc-031d8335-2235.cloud.databricks.com
  prod:
    mode: production
    workspace:
      host: https://dbc-031d8335-2235.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/gabriellucasbauer@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/gabriellucasbauer@gmail.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: gabriellucasbauer@gmail.com
        level: CAN_MANAGE
