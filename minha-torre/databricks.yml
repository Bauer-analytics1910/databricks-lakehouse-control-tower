bundle:
  name: minha-torre

variables:
  sql_warehouse_id:
    description: SQL Warehouse ID
  genie_space_id:
    description: ID do Genie Farol · Diretoria
  genie_space_name:
    description: Nome do Genie Farol · Diretoria

resources:
  apps:
    app:
      name: "minha-torre"
      description: "A Databricks App powered by AppKit"
      source_code_path: ./

      # Start the app automatically on deploy.
      lifecycle:
        started: true
      user_api_scopes:
        - genie
        - dashboards.genie

      # The resources which this app has access to.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.sql_warehouse_id}
            permission: CAN_USE
        - name: genie-space
          genie_space:
            name: ${var.genie_space_name}
            space_id: ${var.genie_space_id}
            permission: CAN_RUN

targets:
  default:
    default: true
    workspace:
      host: https://dbc-031d8335-2235.cloud.databricks.com

    variables:
      sql_warehouse_id: de6ef3f2722321c7
      genie_space_id: 01f1d0b4e6051a10ae8f0da2c0fb49cd
      genie_space_name: "Farol · Diretoria"
